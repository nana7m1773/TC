name: Publish checked L-BOT installers

on:
  push:
    branches: [lbot-release-0.2.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lbot-release-0.2.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore prepared packages and verify their transport hashes
        id: packages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          folder=Path('.release-transfer').resolve()
          manifest=json.loads((folder/'manifest.json').read_text())
          target=manifest['target']
          assert re.fullmatch('[0-9a-f]{40}',target)
          expected={'L-BOT-Setup-0.2.0-x64.exe','L-BOT-Android-0.2.0-arm64-debug.apk','L-BOT-source-0.2.0.zip','L-BOT-validation-0.2.0.zip','SHA256SUMS.txt'}
          assert {item['name'] for item in manifest['files']}==expected
          out=Path('release-files');out.mkdir()
          for item in manifest['files']:
              hasher=hashlib.sha256();size=0
              with (out/item['name']).open('wb') as output:
                  for part in item['parts']:
                      path=(folder/part).resolve()
                      assert path.is_relative_to(folder) and path.is_file()
                      data=path.read_bytes();assert len(data)<=40*1024*1024
                      output.write(data);hasher.update(data);size+=len(data)
              assert size==item['bytes'] and hasher.hexdigest()==item['sha256'],item['name']
          Path('release-target.txt').write_text(target)
          PY
      - name: Upload prepared installers and publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
          gh release upload v0.2.0 --repo "$GITHUB_REPOSITORY" --clobber release-files/*
          gh release edit v0.2.0 --repo "$GITHUB_REPOSITORY" --target "$(cat release-target.txt)" --draft=false --prerelease
