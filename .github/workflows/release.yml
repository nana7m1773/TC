name: Publish verified L-BOT offline installers
on:
  push:
    branches: [lbot-release-0.4.0]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lbot-release-0.4.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LBOT_MODEL_CACHE: ${{ runner.temp }}/lbot-models
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore verified small release files and signed APK template
        run: |
          set -euo pipefail
          node --version
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          folder=Path('.release-transfer').resolve()
          manifest=json.loads((folder/'manifest.json').read_text())
          assert re.fullmatch('[0-9a-f]{40}',manifest['target'])
          expected={'L-BOT-Setup-0.4.0-x64.exe','L-BOT-source-0.4.0.zip','L-BOT-validation-0.4.0.zip','SHA256SUMS.txt','android-signed-template.bin','android-sparse.json'}
          assert {i['name'] for i in manifest['files']}==expected
          out=Path('release-files');out.mkdir()
          for item in manifest['files']:
              digest=hashlib.sha256();size=0
              with (out/item['name']).open('wb') as target:
                  for part in item['parts']:
                      file=(folder/part).resolve()
                      assert file.is_relative_to(folder)
                      data=file.read_bytes();assert len(data)<=40*1024*1024
                      target.write(data);digest.update(data);size+=len(data)
              assert size==item['bytes'] and digest.hexdigest()==item['sha256']
          Path('release-target.txt').write_text(manifest['target'])
          PY
      - name: Fetch pinned verified model bytes on the release runner
        run: |
          set -euo pipefail
          node scripts/prepare-preinstalled.mjs --windows --download
          node scripts/prepare-preinstalled.mjs --android --download
      - name: Reconstruct the original signed APK exactly and upload it
        run: |
          set -euo pipefail
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
          python3 scripts/offline-release.py restore --folder release-files --cache "$LBOT_MODEL_CACHE" --destination release-files
          (cd release-files && sha256sum --check --ignore-missing SHA256SUMS.txt)
          gh release upload v0.4.0 --repo "$GITHUB_REPOSITORY" --clobber release-files/L-BOT-Android-0.4.0-arm64-debug.apk
          rm release-files/L-BOT-Android-0.4.0-arm64-debug.apk
          # These local hardlinks are not needed after byte-for-byte APK reconstruction.
          rm -rf apps/android/app/src/main/assets/preinstalled-models
      - name: Build and upload verified offline model volumes, one at a time
        run: |
          set -euo pipefail
          python3 scripts/offline-release.py parts --cache "$LBOT_MODEL_CACHE" --destination model-volumes --checksums release-files/SHA256SUMS.txt --upload v0.4.0
      - name: Upload installers and publish
        run: |
          set -euo pipefail
          gh release upload v0.4.0 --repo "$GITHUB_REPOSITORY" --clobber release-files/L-BOT-Setup-0.4.0-x64.exe release-files/L-BOT-source-0.4.0.zip release-files/L-BOT-validation-0.4.0.zip release-files/SHA256SUMS.txt
          gh release edit v0.4.0 --repo "$GITHUB_REPOSITORY" --target "$(cat release-target.txt)" --draft=false --prerelease
