plugins { id 'com.android.application' }

android {
    namespace 'cn.muyu.assistant'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'cn.tc.assistant'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DLLAMA_SOURCE_DIR=${System.getenv('LLAMA_SOURCE_DIR') ?: '/workspace/.cache/llama.cpp-new'}", "-DWHISPER_SOURCE_DIR=${System.getenv('WHISPER_SOURCE_DIR') ?: '/workspace/.cache/whisper.cpp'}", '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false } }
    androidResources { noCompress += ['gguf', 'bin'] }
    packaging { jniLibs { useLegacyPackaging false } }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
}
